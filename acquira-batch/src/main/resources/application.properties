server.port=8085
spring.application.name=acquira-batch
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.batch.job.enabled=false
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
logging.file.name=logs/batch.log
