server.port=8085
spring.application.name=acquira-batch
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Per-connection timeout overrides — see acquira-core/application.properties for full rationale.
# The dev DB has idle_in_transaction_session_timeout=1min, which kills 250 MB uploads.
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = 0; SET statement_timeout = 0; SET lock_timeout = 0

# ─── Spring Batch metadata tables ───
# initialize-schema=always → creates batch_job_instance, batch_job_execution, etc. at startup
# table-prefix=batch_      → lowercase (PostgreSQL-friendly, matches case convention)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=batch_

spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
logging.file.name=logs/batch.log
