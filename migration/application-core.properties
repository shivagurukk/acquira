server.port=8081
spring.application.name=acquira-core
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
logging.file.name=logs/core.log
