server.port=8084
spring.application.name=acquira-pdf
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
pdf.pool.size=${PDF_POOL_SIZE:4}
pdf.chart.wait.ms=${PDF_CHART_WAIT:800}
# Reports output directory (absolute path on RHEL, relative OK for dev)
pdf.reports.dir=${PDF_REPORTS_DIR:reports}
pdf.batch.data.threads=${PDF_DATA_THREADS:8}
core.service.url=${CORE_SERVICE_URL:http://localhost:8081}
logging.file.name=logs/pdf.log
