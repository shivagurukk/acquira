server.port=8084
spring.application.name=acquira-pdf
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
pdf.pool.size=${PDF_POOL_SIZE:4}
pdf.chart.wait.ms=${PDF_CHART_WAIT:800}
# Reports output directory (absolute path on RHEL, relative OK for dev)
pdf.reports.dir=${PDF_REPORTS_DIR:reports}
pdf.batch.data.threads=${PDF_DATA_THREADS:8}
core.service.url=${CORE_SERVICE_URL:http://localhost:8081}
logging.file.name=logs/pdf.log

# CRITICAL: never auto-run Spring Batch jobs at startup. Without this, Boot's
# default (true) launched merchantReportJob on every standalone start of this
# module — which reads dim_merchant via findAll() and generated PDFs for EVERY
# tenant, regardless of who (or which tenant) started the service.
spring.batch.job.enabled=false

# Disable Thymeleaf template caching during development so .html edits
# are picked up without restarting the server. SET BACK TO `true` IN PRODUCTION.
spring.thymeleaf.cache=false

# ── S3 / Encryption ─────────────────────────────────────────────────────────
# AES-256 key used to encrypt S3 credentials stored in tenant_setting table.
# MUST be exactly 32 characters (256 bits). Change this in production!
# Set via environment variable APP_ENCRYPTION_KEY in prod — never commit the real key.
app.encryption.key=${APP_ENCRYPTION_KEY:AcquiraDefaultEncryptKey32Chars!!}
