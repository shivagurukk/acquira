server.port=8081
spring.application.name=acquira-core
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}

# CORS Configuration
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# Enable SQL Initialization (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# File Upload
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

# Spring Batch - don't auto-run jobs on startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

logging.level.org.springframework.web=INFO
# ─── Path Configuration (OS-aware defaults) ───
# Windows dev:  relative paths resolve from project root
# Linux/RHEL:   override in application-prod.properties with absolute paths
app.logs.dir=${APP_LOGS_DIR:logs}
app.reports.dir=${APP_REPORTS_DIR:reports}
app.data.dir=${APP_DATA_DIR:data}

logging.file.name=${app.logs.dir}/core.log

# Connection Pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.data-source-properties.prepareThreshold=5
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5

# JPA batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# PDF Engine
pdf.pool.size=${PDF_POOL_SIZE:2}
pdf.chart.wait.ms=${PDF_CHART_WAIT:800}
pdf.batch.data.threads=${PDF_DATA_THREADS:4}
pdf.reports.dir=${app.reports.dir}

# Ollama AI
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
