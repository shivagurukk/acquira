# File Upload (supports up to 2GB via browser)
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Tomcat connector limits for big uploads.
# max-http-form-post-size:  Tomcat refuses POST bodies larger than this (default 2MB).
# max-swallow-size:         after the app starts reading, if it returns early Tomcat will
#                           silently consume up to this many bytes from the body. -1 = unlimited
#                           (recommended for large uploads, otherwise the connection looks hung).
# connection-timeout:       how long Tomcat keeps a slow-uploading connection open.
server.tomcat.max-http-form-post-size=2147483647
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=600000

# Timeout for large file uploads (10 minutes)
server.servlet.session.timeout=600
spring.mvc.async.request-timeout=600000

# Spring Batch - don't auto-run jobs on startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ── Snapshot-table retention ─────────────────────────────────────────────────
# merchant_activity_summary and merchant_opportunity_score accumulate one
# snapshot row per merchant per distinct upload date (calc_date). Left
# unbounded they grow forever (~10k rows per upload date) and slowly degrade
# every query that touches them. The transaction batch job prunes rows whose
# calc_date is older than this many days, AFTER writing the new snapshot.
# The Opportunity Intelligence page only reads the latest snapshot per
# merchant, so a 90-day window is ample. Set to 0 to disable pruning.
acquira.retention.snapshot-days=${SNAPSHOT_RETENTION_DAYS:90}

logging.level.org.springframework.web=INFO
# ─── Path Configuration (OS-aware defaults) ───
app.logs.dir=${APP_LOGS_DIR:logs}
app.reports.dir=${APP_REPORTS_DIR:reports}
app.data.dir=${APP_DATA_DIR:data}

logging.file.name=${app.logs.dir}/core.log

# Connection Pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Log a stack trace when a connection is held >60s without being returned —
# surfaces the exact code path pinning the pool instead of a silent stall.
spring.datasource.hikari.leak-detection-threshold=60000

# HTTP compression — report JSON payloads run to multiple MB; gzip cuts them
# ~10x on the wire. Threshold skips tiny responses where gzip is overhead.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048
spring.datasource.hikari.data-source-properties.prepareThreshold=5
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5

# CRITICAL (idle-in-transaction zombie fix):
#   With JPA on the classpath, Hikari's default for new connections is
#   autoCommit=false. That means any jdbcTemplate.update(...) called from
#   a NON-Spring-managed thread (notably the worker threads inside
#   populateSummaryTasklet's CompletableFuture pool) opens an implicit
#   PG transaction that JdbcTemplate never commits. The connection goes
#   back to the pool in 'idle in transaction' state, holding locks until
#   idle_in_transaction_session_timeout fires — which we've also disabled
#   below, so they leak forever.
#
#   Setting auto-commit=true here makes raw JDBC calls commit on each
#   statement boundary, which is what 'propagation NEVER' implicitly
#   relies on. JPA still works correctly because Spring's
#   JpaTransactionManager explicitly calls setAutoCommit(false) when it
#   begins a transaction and restores the original on commit/rollback.
spring.datasource.hikari.auto-commit=true

# CRITICAL: per-connection timeout overrides for batch ingestion.
# The dev/RHEL Postgres instance has idle_in_transaction_session_timeout=1min set
# at the server level, which kills any 250 MB upload mid-step. We can't always
# change that on shared/managed databases, so we override it for OUR connections
# only. Hikari runs this SQL once per new connection.
#   - idle_in_transaction_session_timeout=0  : don't kill us between SQL calls
#   - statement_timeout=0                    : let big aggregations finish
#   - lock_timeout=0                         : already 0 globally; explicit for safety
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = 0; SET statement_timeout = 0; SET lock_timeout = 0

# JPA batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# PDF Engine
pdf.pool.size=${PDF_POOL_SIZE:2}
pdf.chart.wait.ms=${PDF_CHART_WAIT:300}
pdf.batch.data.threads=${PDF_DATA_THREADS:4}
pdf.reports.dir=${app.reports.dir}

# ════════════════════════════════════════════════════════════════
#  AI ASSISTANT — model provider + query guardrails (ALL AI CONFIG HERE)
#  Backend: AiQueryService + com.acquira.ai.provider.* (ModelProviderConfig
#  picks the @Primary provider from ai.provider). Default 'ollama' is fully
#  local — nothing leaves the host. Switching to a remote provider sends the
#  prompt (which includes the warehouse schema) to a third-party API: a
#  deliberate, compliance-gated choice.
# ════════════════════════════════════════════════════════════════
# Active provider: ollama | anthropic | openai | gemini
ai.provider=${AI_PROVIDER:ollama}

# ── Ollama (local, default) ──────────────────────────────────────
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

# ── Anthropic (Claude) — used only when ai.provider=anthropic ────
# Key is a secret (see acquira.secrets.keys above). Verify the exact model id
# against Anthropic's current list before go-live.
ai.anthropic.api-key=${AI_ANTHROPIC_API_KEY:}
ai.anthropic.base-url=${AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
ai.anthropic.model=${AI_ANTHROPIC_MODEL:claude-opus-5}
ai.anthropic.version=${AI_ANTHROPIC_VERSION:2023-06-01}
# Caps thinking + response text together; 600 truncates on thinking models.
ai.anthropic.max-tokens=${AI_ANTHROPIC_MAX_TOKENS:4000}
ai.anthropic.models=${AI_ANTHROPIC_MODELS:claude-opus-5,claude-sonnet-5,claude-haiku-4-5}

# ── OpenAI — used only when ai.provider=openai ───────────────────
# base-url is overridable for Azure OpenAI / compatible gateways.
ai.openai.api-key=${AI_OPENAI_API_KEY:}
ai.openai.base-url=${AI_OPENAI_BASE_URL:https://api.openai.com}
ai.openai.model=${AI_OPENAI_MODEL:gpt-4o}
ai.openai.max-tokens=${AI_OPENAI_MAX_TOKENS:600}
ai.openai.models=${AI_OPENAI_MODELS:gpt-4o,gpt-4o-mini,gpt-4.1}

# ── Google Gemini — used only when ai.provider=gemini ────────────
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.gemini.base-url=${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-2.0-flash}
ai.gemini.max-tokens=${AI_GEMINI_MAX_TOKENS:600}
ai.gemini.models=${AI_GEMINI_MODELS:gemini-2.0-flash,gemini-2.5-flash,gemini-2.5-pro}

# ── Query guardrails (all providers) ─────────────────────────────
# Hard row cap wrapped around every generated SELECT; per-statement timeout
# (ms) applied via SET LOCAL, overriding the global statement_timeout=0.
ai.query.row-limit=${AI_QUERY_ROW_LIMIT:1000}
ai.query.timeout-ms=${AI_QUERY_TIMEOUT_MS:15000}

# Microsoft SSO (Azure AD / Entra ID)
sso.microsoft.client-id=${SSO_MS_CLIENT_ID:}
sso.microsoft.client-secret=${SSO_MS_CLIENT_SECRET:}
sso.microsoft.tenant-id=${SSO_MS_TENANT_ID:common}
sso.microsoft.redirect-uri=${SSO_MS_REDIRECT_URI:http://localhost:5173/auth/sso/callback}
sso.microsoft.enabled=${SSO_MS_ENABLED:false}

# ── S3 Credential Encryption ─────────────────────────────────────────────────
# AES-256-GCM key for encrypting S3 credentials stored in tenant_setting.
# Must be exactly 32 characters (256 bits).
# In production: set via environment variable APP_ENCRYPTION_KEY — never commit the real key.
app.encryption.key=${APP_ENCRYPTION_KEY:AcquiraDefaultEncryptKey32Chars!!}

# ── Transaction Load Mode ────────────────────────────────────────────────────
# Global mode for TRANSACTION uploads (AMS and CMM alike): REPLACE or APPEND.
#   REPLACE (default) = delete existing fact rows for the file's dates, then reinsert.
#   APPEND            = layer the file onto existing rows for those dates (scheme-scoped delete).
# NOTE: JCB* files are ALWAYS APPEND regardless of this flag. Merchant files ignore this (always UPSERT).
# AMS vs CMM is decided by filename (AMS_* = AMS, skips amount division); this flag is independent of that.
acquira.load.mode=${ACQUIRA_LOAD_MODE:REPLACE}

# ── Backup tooling (E2E 2026-08-15): point to PostgreSQL 16 bin so BackupService
#    can find pg_dump/pg_restore when they are not on the system PATH.
app.backup.pg-dump=C:/Program Files/PostgreSQL/18/bin/pg_dump.exe
app.backup.pg-restore=C:/Program Files/PostgreSQL/18/bin/pg_restore.exe
