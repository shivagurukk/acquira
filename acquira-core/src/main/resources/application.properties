# Startup SQL scripts. By default spring.sql.init only runs schema.sql; once
# schema-locations is set explicitly it must list EVERY schema script.
# Order matters: schema.sql first (creates tables), then the index script.
# Each script is idempotent (IF NOT EXISTS) so re-running on every startup is
# cheap after the first build. This project has no Flyway/Liquibase — this
# property is how db/migration SQL is actually applied.
# All migration scripts listed here run in order on every startup.
# Every script MUST be idempotent (IF NOT EXISTS / ON CONFLICT / UPDATE WHERE).
# Add new migration scripts to the END of this list — order matters.
# ORDERING RULE: a migration that ALTERs a table must be listed AFTER the
# migration that CREATEs it. V2026_02_28_01 creates alert_rule/alert_history/
# api_key (+ menu grants); V2026_07_04_01 then extends api_key — so 02_28_01
# must come first. Both are idempotent.
spring.sql.init.schema-locations=\
  classpath:schema.sql,\
  classpath:schema_extras.sql,\
  classpath:db/migration/V2026_02_28_01__new_screens_security_alerts_api.sql,\
