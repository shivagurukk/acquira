# ════════════════════════════════════════════════════════════════
#  Secret resolution — ONE flag selects how the secrets below are read.
#  Resolved at startup (before the datasource/JWT beans) by
#  SecretsEnvironmentPostProcessor.
#    PLAIN      values used verbatim (default; local/dev)
#    ENCRYPTED  values are 'enc:v1:...' tokens, decrypted with the master key
#               (APP_ENCRYPTION_KEY env var, or app.encryption.key). Generate
#               tokens with the standalone com.acquira.common.tools.SecretEncryptorTool
#    AWS        values pulled from AWS Secrets Manager (a single JSON secret),
#               overriding the file. Requires the secretsmanager SDK jar.
# ════════════════════════════════════════════════════════════════
acquira.secrets.provider=${SECRETS_PROVIDER:PLAIN}
# AI provider API keys are secrets too — listed here so they flow through the
# PLAIN/ENCRYPTED/AWS resolver. They stay empty (harmless) unless ai.provider
# is switched to that provider. Keep them out of source control in prod:
# supply via env vars, enc:v1 tokens, or AWS Secrets Manager.
acquira.secrets.keys=${SECRETS_KEYS:spring.datasource.password,jwt.secret,ai.anthropic.api-key,ai.openai.api-key,ai.gemini.api-key}
# Master key for ENCRYPTED mode — prefer the APP_ENCRYPTION_KEY env var (>=32 chars):
#app.encryption.key=${APP_ENCRYPTION_KEY:}
# AWS mode settings (only read when provider=AWS):
#acquira.secrets.aws.secret-id=${SECRETS_AWS_SECRET_ID:acquira/prod/secrets}
#acquira.secrets.aws.region=${SECRETS_AWS_REGION:}
# Optional property->JSON-field mapping (default field name = the property key):
#acquira.secrets.aws.map.spring.datasource.password=db_password
#acquira.secrets.aws.map.jwt.secret=jwt_secret

# CORS Configuration
# 5174 is included because Vite falls back to it when 5173 is taken; without it
# every login from that port fails as "Invalid CORS request" (a 403 that looks
# like bad credentials) before the request ever reaches AuthController.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# Enable SQL Initialization (data.sql)
spring.sql.init.mode=${SQL_INIT_MODE:always}
#spring.sql.init.mode=${SQL_INIT_MODE:never}
