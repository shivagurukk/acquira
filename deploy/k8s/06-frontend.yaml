apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquira-frontend
  namespace: acquira
spec:
  replicas: 1                # safe to scale up later (stateless)
  selector:
    matchLabels: { app: acquira-frontend }
  template:
    metadata:
      labels: { app: acquira-frontend }
    spec:
      containers:
        - name: frontend
          image: acquira-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: acquira-frontend
  namespace: acquira
spec:
  selector: { app: acquira-frontend }
  ports:
    - { port: 80, targetPort: 80 }
