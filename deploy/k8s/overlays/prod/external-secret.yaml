# =============================================================================
# acquira-secrets from AWS Secrets Manager (External Secrets Operator).
#
# Prerequisites (cluster-level, done once): the External Secrets Operator and a
# ClusterSecretStore that can read Secrets Manager (IRSA role). If you do not
# run ESO, delete this file from kustomization.yaml and create the Secret
# yourself:  kubectl -n acquira create secret generic acquira-secrets --from-env-file=...
#
# The Secrets Manager secret is ONE JSON object with these keys:
#   SPRING_DATASOURCE_PASSWORD, JWT_SECRET_KEY, APP_ENCRYPTION_KEY
#   and, recommended, APP_INTERNAL_TOKEN (>= 32 random chars): the pod-to-pod
#   token. Without it the token is derived from JWT_SECRET_KEY.
# (APP_ENCRYPTION_KEY must be the value already in use — changing it makes the
# stored SMTP/S3/integration secrets undecryptable.)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acquira-secrets
  namespace: acquira
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager        # CHANGE-ME: your ClusterSecretStore
  target:
    name: acquira-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: acquira/prod            # CHANGE-ME: Secrets Manager secret name
