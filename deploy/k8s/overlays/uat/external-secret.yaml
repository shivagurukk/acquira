# acquira-secrets from AWS Secrets Manager — see overlays/prod/external-secret.yaml
# for prerequisites and the expected keys.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acquira-secrets
  namespace: acquira
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager        # CHANGE-ME: your ClusterSecretStore
  target:
    name: acquira-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: acquira/uat             # CHANGE-ME: Secrets Manager secret name
