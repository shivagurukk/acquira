apiVersion: v1
kind: ConfigMap
metadata:
  name: acquira-config
  namespace: acquira
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://acquira-db:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  APP_REPORTS_DIR: "/opt/acquira/reports"
  # Keep "never" in every shared/prod cluster and run the migration Job (08-*)
  # to install the schema. "always" re-runs schema.sql (DDL DROPs + re-seed) on
  # EVERY pod start/rolling deploy — only flip it to "always" for a throwaway
  # local kind DB, then flip it back.
  SPRING_SQL_INIT_MODE: "never"
