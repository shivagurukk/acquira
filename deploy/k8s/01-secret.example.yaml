# =============================================================================
# EXAMPLE secret. Copy to 01-secret.yaml, fill REAL values, and DO NOT COMMIT
# the real one (add 01-secret.yaml to .gitignore).
# On AWS this whole object is replaced by External Secrets pulling from
# AWS Secrets Manager — but the env wiring in the Deployment stays identical.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: acquira-secrets
  namespace: acquira
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "postgres"
  JWT_SECRET_KEY: "change-me-min-32-bytes-long-secret"
  # CRITICAL: this AES key must be identical on every pod and must never change,
  # or stored SMTP/S3/integration secrets become undecryptable.
  APP_ENCRYPTION_KEY: "change-me-exactly-32-bytes-aes!!"
