# Security headers for everything nginx serves itself (the SPA shell, bundles,
# fonts, images). API responses get theirs from Spring (SecurityConfig), so the
# /api/ location does NOT include this file.
#
# nginx only inherits add_header from the outer level when a location has none
# of its own, and every static location sets Cache-Control — so each of them
# includes this file explicitly.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Ignored by browsers over plain http, so harmless in local/compose runs.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# What the SPA is allowed to load. Scripts: own origin only (no inline, no eval).
# Styles: inline is needed (React style props, framer-motion); the Google Fonts
# stylesheet is the @import at the top of frontend/src/index.css. Images allow
# https: for user photo URLs; blob: covers exports and PDF previews.
# Loading anything from a new origin means adding it here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
