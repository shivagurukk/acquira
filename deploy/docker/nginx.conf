server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 2GB uploads (matches the app's multipart tuning)
    client_max_body_size 2g;
    # batch/PDF calls can take minutes
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ---------------------------------------------------------------
    # Cache policy. Without this the browser applies *heuristic*
    # freshness to index.html (no Cache-Control => ~10% of its age),
    # so after a deploy it keeps serving the old index.html, which
    # points at the old hashed bundles — the "you must hard-refresh
    # to see the change" symptom. index.html must always revalidate;
    # the hashed assets under /assets/ can be cached forever.
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fonts/images at the root are not content-hashed by Vite, so keep
    # them cacheable but revalidatable rather than immutable.
    location ~* \.(woff2?|ttf|eot|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy.
    #  - In docker-compose the backend service is named "core".
    #  - In Kubernetes this becomes the Service DNS name "acquira-core".
    # TODO(choose): set the upstream to match where you run it.
    location /api/ {
        proxy_pass http://core:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
