server {
    # 8080, not 80: the container runs as a non-root user (Dockerfile.frontend).
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Compression: bundle is ~2.6 MB JS/CSS raw, ~700 KB gzipped. Done here
    # rather than at the ingress so it holds for docker-compose and k8s alike.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml
        font/ttf font/otf application/vnd.ms-fontobject;

    # 2GB uploads (matches the app's multipart tuning)
    client_max_body_size 2g;
    # batch/PDF calls can take minutes
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ---------------------------------------------------------------
    # Cache policy. Without this the browser applies *heuristic*
    # freshness to index.html (no Cache-Control => ~10% of its age),
    # so after a deploy it keeps serving the old index.html, which
    # points at the old hashed bundles — the "you must hard-refresh
    # to see the change" symptom. index.html must always revalidate;
    # the hashed assets under /assets/ can be cached forever.
    # ---------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fonts/images at the root are not content-hashed by Vite, so keep
    # them cacheable but revalidatable rather than immutable.
    location ~* \.(woff2?|ttf|eot|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. ${API_UPSTREAM} is filled in at container start (this
    # file is an nginx template — see Dockerfile.frontend):
    #  - docker-compose: "core:8081" (the image default).
    #  - Kubernetes: set API_UPSTREAM=acquira-core:8081 on the Deployment. There
    #    the ingress routes /api straight to the backend pods, so this block is
    #    only a fallback — but nginx refuses to start if the host can't resolve.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
