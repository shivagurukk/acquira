server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 2GB uploads (matches the app's multipart tuning)
    client_max_body_size 2g;
    # batch/PDF calls can take minutes
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy.
    #  - In docker-compose the backend service is named "core".
    #  - In Kubernetes this becomes the Service DNS name "acquira-core".
    # TODO(choose): set the upstream to match where you run it.
    location /api/ {
        proxy_pass http://core:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
