# =============================================================================
# kind cluster config. The extraPortMappings let the ingress-nginx controller
# be reachable from your Windows browser on localhost:80/443 (kind nodes are
# Docker containers, so ports must be mapped through explicitly).
# Create with:   kind create cluster --config deploy/kind/kind-cluster.yaml
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: acquira
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
