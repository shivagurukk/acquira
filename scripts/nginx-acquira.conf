# ═══════════════════════════════════════════════════════════════════
#  Acquira Platform — Nginx Configuration
#
#  Location:  /etc/nginx/conf.d/acquira.conf
#  Logs:      /opt/acquira/logs/nginx-access.log
#             /opt/acquira/logs/nginx-error.log
#
#  Installation:
#    sudo cp nginx-acquira.conf /etc/nginx/conf.d/acquira.conf
#    sudo nginx -t
#    sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace _ with your actual domain for production, e.g. acquira.example.com
    server_name _;

    # Frontend build output lives here (from `npm run build`)
    root /opt/acquira/frontend;
    index index.html;

    # Upload limit — must match Spring Boot multipart.max-file-size (2048MB)
    client_max_body_size 2048M;

    # Generous timeouts for long PDF generation and batch uploads
    proxy_connect_timeout 60s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # ───────────────────────────────────────────────────────────────
    # Logs — written to the same /opt/acquira/logs directory as
    # the Spring Boot app for easier troubleshooting
    # ───────────────────────────────────────────────────────────────
    access_log /opt/acquira/logs/nginx-access.log;
    error_log  /opt/acquira/logs/nginx-error.log warn;

    # ───────────────────────────────────────────────────────────────
    # /api/* → Spring Boot backend on localhost:8081
    # IMPORTANT: NO trailing slash on proxy_pass — preserves /api prefix
    # ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Pass through Authorization and custom headers
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header X-API-Key         $http_x_api_key;

        # WebSocket / upgrade support (future-proof)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering off for streaming responses (SSE / large PDF downloads)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ───────────────────────────────────────────────────────────────
    # Static assets (JS/CSS) with aggressive caching
    # Vite emits hashed filenames so far-future cache is safe
    # ───────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fonts, images at root level
    location ~* \.(woff2?|ttf|eot|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Don't cache index.html (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ───────────────────────────────────────────────────────────────
    # React Router — any unmatched path falls through to index.html
    # This MUST be the last location block
    # ───────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ───────────────────────────────────────────────────────────────
    # Gzip compression
    # ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ───────────────────────────────────────────────────────────────
    # Security headers
    # ───────────────────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection           "1; mode=block" always;
}
