<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Header Bar — Prestige v8.0 -->
    <div th:fragment="header(title, subtitle)" class="report-header">
        <div class="header-left">
            <h1 th:text="${title}">SECTION TITLE</h1>
            <p th:text="${subtitle}">PERIOD</p>
        </div>
        <div class="header-right">
            <!-- Period badge with gold border -->
            <div style="background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04)); padding: 5px 20px; border-radius: 7px; font-size: 9px; font-weight: 600; color: rgba(201,169,98,0.8); letter-spacing: 0.06em; border: 1px solid rgba(201,169,98,0.15); backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.06);" th:text="${subtitle}">PERIOD</div>
            <!-- Bank logo placeholder -->
            <div style="background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); width: 96px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.3); font-weight: 700; font-size: 8px; letter-spacing: 0.07em; border: 1px solid rgba(255,255,255,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);">BANK LOGO</div>
        </div>
    </div>
</body>
</html>
