<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Header Bar -->
    <div th:fragment="header(title, subtitle)" class="report-header">
        <div class="header-left">
            <h1 th:text="${title}">SECTION TITLE</h1>
            <p th:text="${subtitle}">PERIOD</p>
        </div>
        <div class="header-right">
            <div style="background: rgba(255,255,255,0.15); padding: 4px 16px; border-radius: 4px; font-size: 9px; font-weight: 600; color: #93C5FD; letter-spacing: 0.04em;" th:text="${subtitle}">PERIOD</div>
            <div style="background: rgba(255,255,255,0.1); width: 90px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-weight: 700; font-size: 8px; letter-spacing: 0.05em;">BANK LOGO</div>
        </div>
    </div>
</body>
</html>
