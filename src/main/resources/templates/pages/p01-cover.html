<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="coverContent" style="background: linear-gradient(160deg, #0A1628 0%, #0F2042 40%, #1E3A8A 100%); color: white; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; padding: 0; overflow: hidden;">

        <!-- Geometric mesh background pattern -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.04; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.5"/>
                </pattern>
                <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
                    <circle cx="15" cy="15" r="1" fill="white"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)"/>
            <rect width="100%" height="100%" fill="url(#dots)"/>
        </svg>

        <!-- Diagonal accent line -->
        <div style="position: absolute; top: 0; right: 0; width: 350px; height: 350px; background: linear-gradient(135deg, rgba(37,99,235,0.12) 0%, transparent 70%); pointer-events: none;"></div>
        <div style="position: absolute; bottom: 0; left: 0; width: 300px; height: 300px; background: linear-gradient(315deg, rgba(59,130,246,0.08) 0%, transparent 70%); pointer-events: none;"></div>

        <!-- Top bar: Period + Confidential -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; position: relative; z-index: 2;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="background: #2563EB; color: white; padding: 5px 16px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;" th:text="${reportPeriod}">2026-01</div>
                <div style="font-size: 8px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em;">CONFIDENTIAL</div>
            </div>
            <div style="background: rgba(255,255,255,0.08); width: 100px; height: 28px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.4); font-weight: 700; font-size: 8px; letter-spacing: 0.05em; border: 1px solid rgba(255,255,255,0.08);">BANK LOGO</div>
        </div>

        <!-- Main content — centered -->
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 60px; position: relative; z-index: 2;">

            <!-- Acquira icon -->
            <div style="width: 56px; height: 56px; border: 2px solid rgba(255,255,255,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; background: rgba(255,255,255,0.03);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                    <path d="M2 17L12 22L22 17" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                    <path d="M2 12L12 17L22 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
                </svg>
            </div>

            <!-- Title block -->
            <div style="font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: #60A5FA; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px;">Monthly Merchant Report</div>
            <h1 style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 44px; font-weight: 800; margin-bottom: 6px; color: white; letter-spacing: -0.01em; line-height: 1.05;">PERFORMANCE</h1>
            <h1 style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 44px; font-weight: 800; margin-bottom: 0; color: white; letter-spacing: -0.01em; line-height: 1.05;">INSIGHTS</h1>

            <!-- Gradient divider -->
            <div style="width: 60px; height: 3px; background: linear-gradient(90deg, #3B82F6, #60A5FA); margin: 24px 0; border-radius: 2px;"></div>

            <!-- Merchant name -->
            <h2 style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 22px; color: white; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.02em;" th:text="${merchantName}">MERCHANT NAME</h2>
            <p style="font-family: 'Inter', sans-serif; font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.06em;" th:text="${reportPeriod}">PERIOD</p>

            <!-- Executive snapshot — 3 KPIs on cover -->
            <div style="display: flex; gap: 16px; margin-top: 36px;">
                <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 20px; text-align: center; min-width: 120px;">
                    <div style="font-family: 'Inter', sans-serif; font-size: 7px; color: #60A5FA; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">Revenue</div>
                    <div style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 20px; font-weight: 800; color: white; margin-top: 3px;" th:text="'AED ' + ${dto.overview.sales.formattedValue}">AED 0</div>
                    <div style="margin-top: 4px;">
                        <span th:if="${dto.overview.sales.momGrowth >= 0}" style="font-size: 8px; font-weight: 700; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.sales.momGrowth, 1, 2) + '% ↑'}">0%</span>
                        <span th:if="${dto.overview.sales.momGrowth < 0}" style="font-size: 8px; font-weight: 700; color: #FCA5A5; background: rgba(252,165,165,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.sales.momGrowth, 1, 2) + '% ↓'}">0%</span>
                    </div>
                </div>
                <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 20px; text-align: center; min-width: 120px;">
                    <div style="font-family: 'Inter', sans-serif; font-size: 7px; color: #60A5FA; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">Transactions</div>
                    <div style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 20px; font-weight: 800; color: white; margin-top: 3px;" th:text="${dto.overview.transactions.formattedValue}">0</div>
                    <div style="margin-top: 4px;">
                        <span th:if="${dto.overview.transactions.momGrowth >= 0}" style="font-size: 8px; font-weight: 700; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.transactions.momGrowth, 1, 2) + '% ↑'}">0%</span>
                        <span th:if="${dto.overview.transactions.momGrowth < 0}" style="font-size: 8px; font-weight: 700; color: #FCA5A5; background: rgba(252,165,165,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.transactions.momGrowth, 1, 2) + '% ↓'}">0%</span>
                    </div>
                </div>
                <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 20px; text-align: center; min-width: 120px;">
                    <div style="font-family: 'Inter', sans-serif; font-size: 7px; color: #60A5FA; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">Customers</div>
                    <div style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 20px; font-weight: 800; color: white; margin-top: 3px;" th:text="${dto.overview.customers.formattedValue}">0</div>
                    <div style="margin-top: 4px;">
                        <span th:if="${dto.overview.customers.momGrowth >= 0}" style="font-size: 8px; font-weight: 700; color: #34D399; background: rgba(52,211,153,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.customers.momGrowth, 1, 2) + '% ↑'}">0%</span>
                        <span th:if="${dto.overview.customers.momGrowth < 0}" style="font-size: 8px; font-weight: 700; color: #FCA5A5; background: rgba(252,165,165,0.15); padding: 2px 8px; border-radius: 3px;" th:text="${#numbers.formatDecimal(dto.overview.customers.momGrowth, 1, 2) + '% ↓'}">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div style="padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2;">
            <div style="font-size: 7.5px; color: rgba(255,255,255,0.3); letter-spacing: 0.06em;">FINDING NEW WAYS TO HELP YOU SCALE YOUR BUSINESS</div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 30px; height: 1px; background: rgba(255,255,255,0.15);"></div>
                <div style="font-size: 7px; color: rgba(255,255,255,0.3); letter-spacing: 0.06em;">POWERED BY ACQUIRA</div>
            </div>
        </div>
    </div>
</body>
</html>
