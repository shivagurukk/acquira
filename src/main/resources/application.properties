server.port=8081
spring.application.name=Acquira
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/postgres?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY:AcquiraDefaultDevKeyAtLeast32Chars!!}

# CORS Configuration
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# Enable SQL Initialization (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
spring.batch.job.enabled=false
logging.level.org.springframework.web=INFO
logging.file.name=logs/app.log

# ==========================================
# PERFORMANCE: Connection Pool & Batch
# ==========================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Postgres JDBC performance
spring.datasource.hikari.data-source-properties.prepareThreshold=5
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5

# JPA batch settings for Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================================
# PDF ENGINE — High-Performance Settings
# ==========================================
# Browser pool size: auto-detects CPU cores, max 12
# On 8-core machine: 8 slots → 20K reports in ~4-5 min
# On 4-core machine: 4 slots → 20K reports in ~8-12 min
pdf.pool.size=${PDF_POOL_SIZE:8}
# Chart.js render wait (ms) — lower = faster but charts may not fully render
# 150ms is safe for Chart.js; drop to 100ms if charts are simple bar/line
pdf.chart.wait.ms=${PDF_CHART_WAIT:150}
# Parallel threads for data fetching (DB-bound)
pdf.batch.data.threads=${PDF_DATA_THREADS:8}

# ==========================================
# OLLAMA AI ASSISTANT
# ==========================================
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
